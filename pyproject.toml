[project]
name = "resource-mcp"
version = "0.1.0"
description = "Demo MCP server powered by FastMCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "googlesearch-python>=1.3.0",
    "pygithub>=2.8.1",
]

[project.scripts]
resource-mcp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = ["src/main.py"]

[tool.uv]
package = true
